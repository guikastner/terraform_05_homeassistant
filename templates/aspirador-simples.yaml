title: Aspirador
views:
  - title: Aspirador
    path: aspirador
    icon: mdi:robot-vacuum
    cards:
      - type: tile
        entity: vacuum.xiaomi_ov71gl_f287_robot_cleaner
        name: Gertrudes
        features:
          - type: vacuum-commands
            commands:
              - start_pause
              - stop
              - return_home

      - type: grid
        title: Acoes rapidas
        columns: 3
        square: false
        cards:
          - type: button
            name: Iniciar
            icon: mdi:play
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.xiaomi_ov71gl_f287_start_sweep
          - type: button
            name: Pausar
            icon: mdi:pause
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.xiaomi_ov71gl_f287_pause_sweeping
          - type: button
            name: Continuar
            icon: mdi:play-pause
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.xiaomi_ov71gl_f287_continue_sweep
          - type: button
            name: Parar
            icon: mdi:stop
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.xiaomi_ov71gl_f287_stop_sweeping
          - type: button
            name: Base
            icon: mdi:home-import-outline
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.xiaomi_ov71gl_f287_stop_and_gocharge
          - type: button
            name: Localizar
            icon: mdi:crosshairs-question
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.xiaomi_ov71gl_f287_identify

      - type: entities
        title: Modo e status
        entities:
          - entity: sensor.xiaomi_ov71gl_f287_status
            name: Status
          - entity: sensor.xiaomi_ov71gl_f287_battery_level
            name: Bateria
          - entity: sensor.xiaomi_ov71gl_f287_charging_state
            name: Carga
          - entity: select.xiaomi_ov71gl_f287_mode
            name: Succao
          - entity: select.xiaomi_ov71gl_f287_sweep_mop_type
            name: Modo
          - entity: select.xiaomi_ov71gl_f287_mop_water_output_level
            name: Agua do mop
          - entity: select.xiaomi_ov71gl_f287_clean_times
            name: Passadas

      - type: grid
        title: Comodos
        columns: 2
        square: false
        cards:
          - type: button
            entity: script.aspirador_limpar_cozinha
            name: Cozinha
            icon: mdi:stove
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.aspirador_limpar_cozinha
          - type: button
            entity: script.aspirador_limpar_sala_de_estar
            name: Sala de estar
            icon: mdi:sofa
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.aspirador_limpar_sala_de_estar
          - type: button
            entity: script.aspirador_limpar_escritorio_gabi
            name: Escritorio Gabi
            icon: mdi:desk
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.aspirador_limpar_escritorio_gabi
          - type: button
            entity: script.aspirador_limpar_quarto_casal
            name: Quarto casal
            icon: mdi:bed-king
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.aspirador_limpar_quarto_casal
          - type: button
            entity: script.aspirador_limpar_quarto_gurias
            name: Quarto gurias
            icon: mdi:bed
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.aspirador_limpar_quarto_gurias
          - type: button
            entity: script.aspirador_limpar_comodo_7
            name: Comodo 7
            icon: mdi:door-open
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.aspirador_limpar_comodo_7
          - type: button
            entity: script.aspirador_limpar_comodo_9
            name: Comodo 9
            icon: mdi:door-open
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.aspirador_limpar_comodo_9
          - type: button
            entity: script.aspirador_limpar_comodo_10
            name: Comodo 10
            icon: mdi:door-open
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.aspirador_limpar_comodo_10

      - type: entities
        title: Manutencao
        entities:
          - entity: sensor.xiaomi_ov71gl_f287_cleaning_area
            name: Area limpa
          - entity: sensor.xiaomi_ov71gl_f287_cleaning_time
            name: Tempo de limpeza
          - entity: sensor.xiaomi_ov71gl_f287_filter_life_level
            name: Filtro
          - entity: sensor.xiaomi_ov71gl_f287_brush_life_level
            name: Escova principal
          - entity: sensor.xiaomi_ov71gl_f287_brush_life_level_2
            name: Escova lateral
          - entity: sensor.xiaomi_ov71gl_f287_mop_life_level
            name: Mop
