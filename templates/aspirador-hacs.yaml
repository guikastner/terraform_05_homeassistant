title: Aspirador HACS
views:
  - title: Aspirador
    path: aspirador-hacs
    icon: mdi:robot-vacuum
    cards:
      - type: custom:vacuum-card
        entity: vacuum.xiaomi_ov71gl_f287_robot_cleaner
        name: Gertrudes
        compact_view: false
        show_status: true
        show_name: true
        show_toolbar: true
        stats:
          default:
            - entity_id: sensor.xiaomi_ov71gl_f287_battery_level
              unit: "%"
              subtitle: Bateria
            - entity_id: sensor.xiaomi_ov71gl_f287_charging_state
              subtitle: Carga
            - entity_id: sensor.xiaomi_ov71gl_f287_filter_life_level
              unit: "%"
              subtitle: Filtro
          cleaning:
            - entity_id: sensor.xiaomi_ov71gl_f287_cleaning_area
              unit: m2
              subtitle: Area
            - entity_id: sensor.xiaomi_ov71gl_f287_cleaning_time
              unit: min
              subtitle: Tempo

      - type: grid
        title: Acoes rapidas
        columns: 3
        square: false
        cards:
          - type: button
            name: Varrer
            icon: mdi:broom
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.xiaomi_ov71gl_f287_start_only_sweep
          - type: button
            name: Mop
            icon: mdi:water
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.xiaomi_ov71gl_f287_start_mop
          - type: button
            name: Varrer e mop
            icon: mdi:robot-vacuum
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.xiaomi_ov71gl_f287_start_sweep_mop
          - type: button
            name: Lavar mop
            icon: mdi:waves
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.xiaomi_ov71gl_f287_start_mop_wash
          - type: button
            name: Esvaziar po
            icon: mdi:delete-empty
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.xiaomi_ov71gl_f287_start_dust_arrest
          - type: button
            name: Base
            icon: mdi:home-import-outline
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.xiaomi_ov71gl_f287_stop_and_gocharge

      - type: entities
        title: Ajustes
        entities:
          - entity: select.xiaomi_ov71gl_f287_mode
            name: Succao
          - entity: select.xiaomi_ov71gl_f287_sweep_mop_type
            name: Modo
          - entity: select.xiaomi_ov71gl_f287_sweep_route
            name: Rota
          - entity: select.xiaomi_ov71gl_f287_mop_water_output_level
            name: Agua do mop
          - entity: select.xiaomi_ov71gl_f287_frequency_mop_wash
            name: Frequencia lavagem mop
          - entity: switch.xiaomi_ov71gl_f287_carpet_boost
            name: Turbo em tapete
          - entity: switch.xiaomi_ov71gl_f287_no_disturb
            name: Nao perturbe

      - type: grid
        title: Comodos
        columns: 2
        square: false
        cards:
          - type: button
            entity: script.aspirador_limpar_cozinha
            name: Cozinha
            icon: mdi:stove
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.aspirador_limpar_cozinha
          - type: button
            entity: script.aspirador_limpar_sala_de_estar
            name: Sala de estar
            icon: mdi:sofa
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.aspirador_limpar_sala_de_estar
          - type: button
            entity: script.aspirador_limpar_escritorio_gabi
            name: Escritorio Gabi
            icon: mdi:desk
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.aspirador_limpar_escritorio_gabi
          - type: button
            entity: script.aspirador_limpar_quarto_casal
            name: Quarto casal
            icon: mdi:bed-king
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.aspirador_limpar_quarto_casal
          - type: button
            entity: script.aspirador_limpar_quarto_gurias
            name: Quarto gurias
            icon: mdi:bed
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.aspirador_limpar_quarto_gurias
          - type: button
            entity: script.aspirador_limpar_comodo_7
            name: Comodo 7
            icon: mdi:door-open
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.aspirador_limpar_comodo_7
          - type: button
            entity: script.aspirador_limpar_comodo_9
            name: Comodo 9
            icon: mdi:door-open
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.aspirador_limpar_comodo_9
          - type: button
            entity: script.aspirador_limpar_comodo_10
            name: Comodo 10
            icon: mdi:door-open
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.aspirador_limpar_comodo_10
