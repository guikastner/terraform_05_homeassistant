title: Echo
views:
  # ---------------------------------------------------------------- Visao geral
  - title: Visao geral
    path: visao-geral
    icon: mdi:account-voice
    type: sections
    max_columns: 3
    badges:
      - type: entity
        entity: binary_sensor.echo_de_guilherme_connectivity
        name: Echo
      - type: entity
        entity: binary_sensor.echo_dot_de_guilherme_connectivity
        name: Echo Dot
      - type: entity
        entity: sensor.echo_de_guilherme_temperature
        name: Temperatura
      - type: entity
        entity: binary_sensor.echo_de_guilherme_motion
        name: Movimento
        visibility:
          - condition: state
            entity: binary_sensor.echo_de_guilherme_motion
            state: "on"

    sections:
      - type: grid
        cards:
          - type: heading
            heading: Echo de Guilherme
            icon: mdi:speaker
            badges:
              - type: entity
                entity: binary_sensor.echo_de_guilherme_connectivity
          - type: tile
            entity: sensor.echo_de_guilherme_temperature
            name: Temperatura
            icon: mdi:thermometer
          - type: tile
            entity: sensor.echo_de_guilherme_illuminance
            name: Luminosidade
            icon: mdi:brightness-6
          - type: tile
            entity: binary_sensor.echo_de_guilherme_motion
            name: Movimento
            icon: mdi:motion-sensor
          - type: tile
            entity: switch.echo_de_guilherme_do_not_disturb
            name: Nao perturbe
            icon: mdi:minus-circle
            tap_action:
              action: toggle

      - type: grid
        cards:
          - type: heading
            heading: Echo Dot de Guilherme
            icon: mdi:speaker-wireless
            badges:
              - type: entity
                entity: binary_sensor.echo_dot_de_guilherme_connectivity
          - type: tile
            entity: binary_sensor.echo_dot_de_guilherme_connectivity
            name: Conectividade
            icon: mdi:wifi
          - type: tile
            entity: switch.echo_dot_de_guilherme_do_not_disturb
            name: Nao perturbe
            icon: mdi:minus-circle
            tap_action:
              action: toggle
          - type: markdown
            content: >-
              O Echo Dot nao tem sensores de temperatura, luz ou movimento;
              so o Echo maior reporta esses valores.

      - type: grid
        cards:
          - type: heading
            heading: Alarmes, timers e lembretes
            icon: mdi:alarm
          - type: entities
            title: Echo
            entities:
              - entity: sensor.echo_de_guilherme_next_alarm
                name: Proximo alarme
                icon: mdi:alarm
              - entity: sensor.echo_de_guilherme_next_timer
                name: Proximo timer
                icon: mdi:timer-outline
              - entity: sensor.echo_de_guilherme_next_reminder
                name: Proximo lembrete
                icon: mdi:reminder
          - type: entities
            title: Echo Dot
            entities:
              - entity: sensor.echo_dot_de_guilherme_next_alarm
                name: Proximo alarme
                icon: mdi:alarm
              - entity: sensor.echo_dot_de_guilherme_next_timer
                name: Proximo timer
                icon: mdi:timer-outline
              - entity: sensor.echo_dot_de_guilherme_next_reminder
                name: Proximo lembrete
                icon: mdi:reminder
          - type: markdown
            content: >-
              Alarmes e timers so podem ser criados falando com a Alexa; a
              integracao `alexa_devices` do Home Assistant apenas le o proximo
              de cada tipo.

      - type: grid
        cards:
          - type: heading
            heading: Silenciar tudo
            icon: mdi:bell-off
          - type: grid
            columns: 2
            square: false
            cards:
              - type: button
                name: Nao perturbe ON
                icon: mdi:bell-off
                tap_action:
                  action: perform-action
                  perform_action: switch.turn_on
                  target:
                    entity_id:
                      - switch.echo_de_guilherme_do_not_disturb
                      - switch.echo_dot_de_guilherme_do_not_disturb
              - type: button
                name: Nao perturbe OFF
                icon: mdi:bell-ring
                tap_action:
                  action: perform-action
                  perform_action: switch.turn_off
                  target:
                    entity_id:
                      - switch.echo_de_guilherme_do_not_disturb
                      - switch.echo_dot_de_guilherme_do_not_disturb

  # -------------------------------------------------------------------- Musica
  # Requer a integracao HACS alexa_media_player configurada (login Amazon).
  # Ela e quem cria os media_player das Echos; a integracao core alexa_devices
  # nao cria nenhum.
  - title: Musica
    path: musica
    icon: mdi:music
    type: sections
    max_columns: 3
    badges:
      - type: entity
        entity: media_player.echo_de_guilherme
        name: Echo
      - type: entity
        entity: media_player.echo_dot_de_guilherme
        name: Echo Dot

    sections:
      - type: grid
        cards:
          - type: heading
            heading: Echo de Guilherme
            icon: mdi:speaker
          - type: media-control
            entity: media_player.echo_de_guilherme
          - type: tile
            entity: media_player.echo_de_guilherme
            name: Volume
            icon: mdi:volume-high
            features:
              - type: media-player-volume-slider
          - type: grid
            columns: 4
            square: true
            cards:
              - type: button
                name: Anterior
                icon: mdi:skip-previous
                tap_action:
                  action: perform-action
                  perform_action: media_player.media_previous_track
                  target:
                    entity_id: media_player.echo_de_guilherme
              - type: button
                name: Play/Pause
                icon: mdi:play-pause
                tap_action:
                  action: perform-action
                  perform_action: media_player.media_play_pause
                  target:
                    entity_id: media_player.echo_de_guilherme
              - type: button
                name: Proxima
                icon: mdi:skip-next
                tap_action:
                  action: perform-action
                  perform_action: media_player.media_next_track
                  target:
                    entity_id: media_player.echo_de_guilherme
              - type: button
                name: Parar
                icon: mdi:stop
                tap_action:
                  action: perform-action
                  perform_action: media_player.media_stop
                  target:
                    entity_id: media_player.echo_de_guilherme

      - type: grid
        cards:
          - type: heading
            heading: Echo Dot de Guilherme
            icon: mdi:speaker-wireless
          - type: media-control
            entity: media_player.echo_dot_de_guilherme
          - type: tile
            entity: media_player.echo_dot_de_guilherme
            name: Volume
            icon: mdi:volume-high
            features:
              - type: media-player-volume-slider
          - type: grid
            columns: 4
            square: true
            cards:
              - type: button
                name: Anterior
                icon: mdi:skip-previous
                tap_action:
                  action: perform-action
                  perform_action: media_player.media_previous_track
                  target:
                    entity_id: media_player.echo_dot_de_guilherme
              - type: button
                name: Play/Pause
                icon: mdi:play-pause
                tap_action:
                  action: perform-action
                  perform_action: media_player.media_play_pause
                  target:
                    entity_id: media_player.echo_dot_de_guilherme
              - type: button
                name: Proxima
                icon: mdi:skip-next
                tap_action:
                  action: perform-action
                  perform_action: media_player.media_next_track
                  target:
                    entity_id: media_player.echo_dot_de_guilherme
              - type: button
                name: Parar
                icon: mdi:stop
                tap_action:
                  action: perform-action
                  perform_action: media_player.media_stop
                  target:
                    entity_id: media_player.echo_dot_de_guilherme

      - type: grid
        cards:
          - type: heading
            heading: Comandos de voz
            icon: mdi:microphone-message
          # media_content_type "custom" faz a Alexa executar o texto como se
          # ele tivesse sido falado; e o jeito de disparar qualquer skill.
          - type: grid
            columns: 2
            square: false
            cards:
              - type: button
                name: Tocar radio
                icon: mdi:radio
                tap_action:
                  action: perform-action
                  perform_action: media_player.play_media
                  target:
                    entity_id: media_player.echo_de_guilherme
                  data:
                    media_content_type: custom
                    media_content_id: tocar radio Gaucha
              - type: button
                name: Noticias
                icon: mdi:newspaper
                tap_action:
                  action: perform-action
                  perform_action: media_player.play_media
                  target:
                    entity_id: media_player.echo_de_guilherme
                  data:
                    media_content_type: custom
                    media_content_id: quais sao as noticias
              - type: button
                name: Previsao do tempo
                icon: mdi:weather-partly-cloudy
                tap_action:
                  action: perform-action
                  perform_action: media_player.play_media
                  target:
                    entity_id: media_player.echo_de_guilherme
                  data:
                    media_content_type: custom
                    media_content_id: como esta o tempo
              - type: button
                name: Musica relaxante
                icon: mdi:music-note
                tap_action:
                  action: perform-action
                  perform_action: media_player.play_media
                  target:
                    entity_id: media_player.echo_de_guilherme
                  data:
                    media_content_type: custom
                    media_content_id: tocar musica relaxante
              - type: button
                name: Parar musica
                icon: mdi:stop-circle
                tap_action:
                  action: perform-action
                  perform_action: media_player.media_stop
                  target:
                    entity_id:
                      - media_player.echo_de_guilherme
                      - media_player.echo_dot_de_guilherme
              - type: button
                name: Timer 10 min
                icon: mdi:timer-sand
                tap_action:
                  action: perform-action
                  perform_action: media_player.play_media
                  target:
                    entity_id: media_player.echo_de_guilherme
                  data:
                    media_content_type: custom
                    media_content_id: marcar um timer de dez minutos

      - type: grid
        cards:
          - type: heading
            heading: Volume rapido
            icon: mdi:volume-medium
          - type: grid
            columns: 3
            square: false
            cards:
              - type: button
                name: 20%
                icon: mdi:volume-low
                tap_action:
                  action: perform-action
                  perform_action: media_player.volume_set
                  target:
                    entity_id:
                      - media_player.echo_de_guilherme
                      - media_player.echo_dot_de_guilherme
                  data:
                    volume_level: 0.2
              - type: button
                name: 50%
                icon: mdi:volume-medium
                tap_action:
                  action: perform-action
                  perform_action: media_player.volume_set
                  target:
                    entity_id:
                      - media_player.echo_de_guilherme
                      - media_player.echo_dot_de_guilherme
                  data:
                    volume_level: 0.5
              - type: button
                name: 80%
                icon: mdi:volume-high
                tap_action:
                  action: perform-action
                  perform_action: media_player.volume_set
                  target:
                    entity_id:
                      - media_player.echo_de_guilherme
                      - media_player.echo_dot_de_guilherme
                  data:
                    volume_level: 0.8

  # ------------------------------------------------------------------ Mensagens
  - title: Mensagens
    path: mensagens
    icon: mdi:message-text
    type: sections
    max_columns: 3
    badges:
      - type: entity
        entity: input_select.echo_alvo
        name: Destino
      - type: entity
        entity: input_select.echo_modo
        name: Modo

    sections:
      - type: grid
        cards:
          - type: heading
            heading: Escrever e enviar
            icon: mdi:send
          - type: entities
            entities:
              - entity: input_text.echo_mensagem
                name: Mensagem
              - entity: input_select.echo_alvo
                name: Destino
              - entity: input_select.echo_modo
                name: Modo
          - type: button
            name: Enviar
            icon: mdi:send
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.echo_enviar_mensagem
          - type: markdown
            content: >-
              **Falar** usa a voz normal da Alexa. **Anunciar** toca o som de
              anuncio antes da mensagem e aparece como notificacao no app.

      - type: grid
        cards:
          - type: heading
            heading: Atalhos de destino e modo
            icon: mdi:target
          # Cards Lovelace nao renderizam templates, entao os atalhos ajustam
          # os seletores e o envio continua saindo pelo script, que le o texto.
          - type: grid
            columns: 2
            square: false
            cards:
              - type: button
                name: So no Echo
                icon: mdi:speaker
                tap_action:
                  action: perform-action
                  perform_action: input_select.select_option
                  target:
                    entity_id: input_select.echo_alvo
                  data:
                    option: Echo
              - type: button
                name: So no Echo Dot
                icon: mdi:speaker-wireless
                tap_action:
                  action: perform-action
                  perform_action: input_select.select_option
                  target:
                    entity_id: input_select.echo_alvo
                  data:
                    option: Echo Dot
              - type: button
                name: Nas duas
                icon: mdi:speaker-multiple
                tap_action:
                  action: perform-action
                  perform_action: input_select.select_option
                  target:
                    entity_id: input_select.echo_alvo
                  data:
                    option: Ambas
              - type: button
                name: Modo falar
                icon: mdi:account-voice
                tap_action:
                  action: perform-action
                  perform_action: input_select.select_option
                  target:
                    entity_id: input_select.echo_modo
                  data:
                    option: Falar
              - type: button
                name: Modo anunciar
                icon: mdi:bullhorn
                tap_action:
                  action: perform-action
                  perform_action: input_select.select_option
                  target:
                    entity_id: input_select.echo_modo
                  data:
                    option: Anunciar
              - type: button
                name: Enviar agora
                icon: mdi:send
                tap_action:
                  action: perform-action
                  perform_action: script.turn_on
                  target:
                    entity_id: script.echo_enviar_mensagem

      - type: grid
        cards:
          - type: heading
            heading: Anuncios rapidos (todas as Echos)
            icon: mdi:bullhorn
          - type: grid
            columns: 2
            square: false
            cards:
              - type: button
                name: Jantar pronto
                icon: mdi:silverware-fork-knife
                tap_action:
                  action: perform-action
                  perform_action: notify.send_message
                  target:
                    entity_id: notify.todo_lugar_announce
                  data:
                    message: O jantar esta pronto!
              - type: button
                name: Ja vou
                icon: mdi:run
                tap_action:
                  action: perform-action
                  perform_action: notify.send_message
                  target:
                    entity_id: notify.todo_lugar_announce
                  data:
                    message: Ja estou indo!
              - type: button
                name: Hora de dormir
                icon: mdi:sleep
                tap_action:
                  action: perform-action
                  perform_action: notify.send_message
                  target:
                    entity_id: notify.todo_lugar_announce
                  data:
                    message: Hora de dormir!
              - type: button
                name: Vem aqui
                icon: mdi:hand-wave
                tap_action:
                  action: perform-action
                  perform_action: notify.send_message
                  target:
                    entity_id: notify.todo_lugar_announce
                  data:
                    message: Vem aqui, por favor!
              - type: button
                name: Bom dia
                icon: mdi:weather-sunny
                tap_action:
                  action: perform-action
                  perform_action: notify.send_message
                  target:
                    entity_id: notify.todo_lugar_announce
                  data:
                    message: Bom dia! Hora de acordar.
              - type: button
                name: Chegou visita
                icon: mdi:door-open
                tap_action:
                  action: perform-action
                  perform_action: notify.send_message
                  target:
                    entity_id: notify.todo_lugar_announce
                  data:
                    message: Tem alguem na porta!

      - type: grid
        cards:
          - type: heading
            heading: Relaxamento
            icon: mdi:meditation
          - type: grid
            columns: 2
            square: false
            cards:
              - type: button
                name: Hora de relaxar
                icon: mdi:spa
                tap_action:
                  action: perform-action
                  perform_action: notify.send_message
                  target:
                    entity_id: notify.relaxamento_announce
                  data:
                    message: Hora de relaxar.
              - type: button
                name: Boa noite
                icon: mdi:weather-night
                tap_action:
                  action: perform-action
                  perform_action: notify.send_message
                  target:
                    entity_id: notify.relaxamento_announce
                  data:
                    message: Boa noite, durma bem.

  # ----------------------------------------------------------- Rotinas/historico
  - title: Rotinas e historico
    path: rotinas
    icon: mdi:playlist-play
    type: sections
    max_columns: 3

    sections:
      - type: grid
        cards:
          - type: heading
            heading: Rotinas Alexa
            icon: mdi:playlist-play
          - type: grid
            columns: 2
            square: false
            cards:
              - type: button
                name: Bom dia
                icon: mdi:weather-sunny
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.gui_kastner_hotmail_com_alexa_bom_dia
              - type: button
                name: Apagar
                icon: mdi:lightbulb-off
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.gui_kastner_hotmail_com_apagar
              - type: button
                name: Luz 50%
                icon: mdi:brightness-6
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.gui_kastner_hotmail_com_luz_50
              - type: button
                name: Luz branca
                icon: mdi:lightbulb-on
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.gui_kastner_hotmail_com_luz_branca
              - type: button
                name: TV confortavel
                icon: mdi:television-ambient-light
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.gui_kastner_hotmail_com_tv_confortavel
              - type: button
                name: Luz azul fraca
                icon: mdi:lightbulb-night
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.gui_kastner_hotmail_com_luz_azul_fraca
              - type: button
                name: Luz azul no quarto
                icon: mdi:bed
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.gui_kastner_hotmail_com_luz_azul_no_quarto

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Historico
            icon: mdi:chart-line
          - type: history-graph
            title: Temperatura (24h)
            hours_to_show: 24
            entities:
              - entity: sensor.echo_de_guilherme_temperature
                name: Temperatura
          - type: history-graph
            title: Luminosidade e movimento (24h)
            hours_to_show: 24
            entities:
              - entity: sensor.echo_de_guilherme_illuminance
                name: Luminosidade
              - entity: binary_sensor.echo_de_guilherme_motion
                name: Movimento
          - type: history-graph
            title: Conectividade (24h)
            hours_to_show: 24
            entities:
              - entity: binary_sensor.echo_de_guilherme_connectivity
                name: Echo
              - entity: binary_sensor.echo_dot_de_guilherme_connectivity
                name: Echo Dot
          - type: logbook
            target:
              entity_id:
                - binary_sensor.echo_de_guilherme_motion
                - switch.echo_de_guilherme_do_not_disturb
                - switch.echo_dot_de_guilherme_do_not_disturb
                - script.echo_enviar_mensagem
            hours_to_show: 24

      - type: grid
        cards:
          - type: heading
            heading: Sobre esta integracao
            icon: mdi:information-outline
          - type: markdown
            content: >-
              Duas integracoes convivem aqui. A **core `alexa_devices`** entrega
              os sensores (temperatura, luz, movimento), o "nao perturbe" e as
              entidades `notify` de falar/anunciar usadas nas outras views. A
              **HACS `alexa_media_player`** e a que cria os `media_player` das
              Echos, usados na view **Musica**: volume, play/pause, o que esta
              tocando e os comandos de voz (`media_content_type: custom`).

              Se a view Musica mostrar "entidade nao encontrada", o
              `alexa_media_player` ainda nao foi configurado: Ajustes >
              Dispositivos e servicos > Adicionar integracao > Alexa Media
              Player, com a conta Amazon (o login abre num proxy do proprio
              Home Assistant).
